<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぷりぷり日記帳 - My Cute Diary</title>
    <link rel="icon" href="image%20copy.png" type="image/png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        p: {
                            pink: '#ffafcc',
                            blue: '#a2d2ff',
                            purple: '#cdb4db',
                            text: '#5f4b66',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen transition-colors duration-300">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Top Image -->
        <div class="mb-8 flex justify-center">
            <img src="image%20copy.png" alt="Top Banner" class="rounded-[30px] shadow-lg border-4 border-p-pink-light max-h-[300px] w-full object-cover">
        </div>

        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center gap-6 mb-12">
            <div class="flex items-center gap-4">
                <div class="p-4 bg-p-pink text-white rounded-[25px] shadow-[0_6px_0_#ff8fab] animate-bounce-slow">
                    <i data-lucide="sparkles" class="w-8 h-8"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-bold tracking-tight text-p-text dark:text-pink-200">ぷりぷり日記帳</h1>
                    <p class="text-sm text-p-pink font-bold">きらきらな毎日をのこそう✨</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- Theme Toggle -->
                <button id="themeToggle" class="puri-btn px-4 py-3 bg-white dark:bg-zinc-800 text-p-purple" title="テーマ切り替え">
                    <i data-lucide="sun" id="sunIcon" class="w-6 h-6 hidden"></i>
                    <i data-lucide="moon" id="moonIcon" class="w-6 h-6"></i>
                </button>

                <!-- BGM Toggle -->
                <button id="bgmToggle" class="puri-btn px-4 py-3 bg-white dark:bg-zinc-800 text-p-pink" title="BGMをながす">
                    <i data-lucide="music" id="musicIcon" class="w-6 h-6"></i>
                    <i data-lucide="volume-x" id="muteIcon" class="w-6 h-6 hidden"></i>
                </button>
                <audio id="bgmAudio" loop>
                    <source src="Porcelain_Cups_and_Sunbeams.mp3" type="audio/mpeg">
                </audio>
                
                <!-- Backup -->
                <button id="exportBtn" class="puri-btn px-4 py-3 bg-p-blue text-white" title="日記をのこす">
                    <i data-lucide="cloud-download" class="w-5 h-5"></i>
                    <span class="hidden md:inline">保存する</span>
                </button>
                <button id="importBtn" class="puri-btn px-4 py-3 bg-p-purple text-white" title="日記をよみこむ">
                    <i data-lucide="cloud-upload" class="w-5 h-5"></i>
                    <span class="hidden md:inline">よみこむ</span>
                </button>
                <input type="file" id="fileInput" class="hidden" accept=".json">
            </div>
        </header>

        <!-- Main Content -->
        <main class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <!-- Left Column: Calendar & History -->
            <section class="lg:col-span-5 flex flex-col gap-10">
                <!-- Calendar Card -->
                <div class="puri-card p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold flex items-center gap-2 text-p-text dark:text-pink-200">
                            <i data-lucide="calendar-heart" class="w-6 h-6 text-p-pink"></i>
                            カレンダー
                        </h2>
                        <div class="flex items-center gap-2">
                            <button id="todayBtn" class="puri-btn px-3 py-1 text-xs bg-p-pink-light text-p-text">今日</button>
                            <div class="flex items-center gap-1 ml-2">
                                <button id="prevMonth" class="p-2 hover:bg-p-pink-light rounded-full transition">
                                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                                </button>
                                <span id="calendarYearMonth" class="font-bold text-md px-2 min-w-[100px] text-center">2026年 5月</span>
                                <button id="nextMonth" class="p-2 hover:bg-p-pink-light rounded-full transition">
                                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Calendar Grid -->
                    <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-p-pink mb-4">
                        <div class="text-rose-400">日</div>
                        <div>月</div>
                        <div>火</div>
                        <div>水</div>
                        <div>木</div>
                        <div>金</div>
                        <div class="text-sky-400">土</div>
                    </div>
                    <div id="calendarDays" class="grid grid-cols-7 gap-2 text-center">
                        <!-- JS generated days -->
                    </div>
                </div>

                <!-- Diary List Summary -->
                <div class="puri-card p-8 flex-1 flex flex-col min-h-[400px]">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold flex items-center gap-2 text-p-text dark:text-pink-200">
                            <i data-lucide="flower-2" class="w-6 h-6 text-p-purple"></i>
                            おもいで
                        </h2>
                        <span id="diaryCount" class="text-xs bg-p-pink text-white px-3 py-1 rounded-full font-bold">0件</span>
                    </div>
                    
                    <!-- Search -->
                    <div class="relative mb-6">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-p-pink">
                            <i data-lucide="search" class="w-5 h-5"></i>
                        </span>
                        <input type="text" id="searchBar" placeholder="おもいでをさがす..." class="w-full pl-12 pr-5 py-3 text-sm bg-p-pink-light/20 border-2 border-p-pink-light rounded-full focus:outline-none focus:border-p-pink transition">
                    </div>

                    <!-- List Container -->
                    <div id="diaryList" class="flex-1 overflow-y-auto max-h-[400px] space-y-4 pr-2">
                        <!-- JS generated list items -->
                    </div>
                </div>
            </section>

            <!-- Right Column: Editor & Viewer -->
            <section class="lg:col-span-7 flex flex-col">
                <div class="puri-card flex-1 flex flex-col overflow-hidden">
                    
                    <!-- Editor Header -->
                    <div class="p-8 border-b-4 border-p-pink-light flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6 bg-white dark:bg-zinc-800">
                        <div>
                            <div class="flex items-center gap-3 text-sm font-bold text-p-pink mb-2">
                                <span id="selectedDayOfWeek" class="bg-p-pink-light text-p-text px-3 py-1 rounded-full">木曜日</span>
                                <span id="selectedFullDate">2026年5月21日</span>
                            </div>
                            <h2 class="text-2xl font-bold text-p-text dark:text-pink-100" id="editorViewTitle">きょうのきろく</h2>
                        </div>
                        
                        <!-- Actions -->
                        <div class="flex items-center gap-3 w-full sm:w-auto">
                            <button id="deleteBtn" class="hidden puri-btn px-4 py-2 bg-white text-rose-400 border-rose-200">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                            <button id="saveBtn" class="puri-btn px-8 py-3 bg-p-pink text-white flex-1 sm:flex-none">
                                <i data-lucide="heart" class="w-5 h-5"></i>
                                ほぞん
                            </button>
                        </div>
                    </div>

                    <!-- Editor Body -->
                    <div class="p-8 flex-1 flex flex-col gap-8">
                        <!-- Mood Selector -->
                        <div>
                            <label class="block text-sm font-bold text-p-pink mb-4">きょうのきぶん</label>
                            <div class="grid grid-cols-5 gap-3" id="moodSelector">
                                <button data-mood="happy" class="mood-btn p-4 flex flex-col items-center gap-1" title="さいこー！">
                                    <span class="text-3xl">💖</span>
                                    <span class="text-[10px] font-bold text-p-text">さいこー</span>
                                </button>
                                <button data-mood="good" class="mood-btn p-4 flex flex-col items-center gap-1" title="はっぴー">
                                    <span class="text-3xl">🌸</span>
                                    <span class="text-[10px] font-bold text-p-text">はっぴー</span>
                                </button>
                                <button data-mood="neutral" class="mood-btn p-4 flex flex-col items-center gap-1" title="ふつう">
                                    <span class="text-3xl">☁️</span>
                                    <span class="text-[10px] font-bold text-p-text">ふつう</span>
                                </button>
                                <button data-mood="tired" class="mood-btn p-4 flex flex-col items-center gap-1" title="おつかれ">
                                    <span class="text-3xl">💤</span>
                                    <span class="text-[10px] font-bold text-p-text">おつかれ</span>
                                </button>
                                <button data-mood="sad" class="mood-btn p-4 flex flex-col items-center gap-1" title="しょぼん">
                                    <span class="text-3xl">☔</span>
                                    <span class="text-[10px] font-bold text-p-text">しょぼん</span>
                                </button>
                            </div>
                        </div>

                        <!-- Photo & Stamp Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <!-- Photo Upload -->
                            <div>
                                <label class="block text-sm font-bold text-p-pink mb-3">きょうのいちまい</label>
                                <div id="photoPreviewContainer" class="relative group cursor-pointer border-4 border-dashed border-p-pink-light rounded-[25px] aspect-video flex flex-col items-center justify-center overflow-hidden bg-p-pink-light/5 hover:bg-p-pink-light/10 transition-all">
                                    <img id="photoPreview" class="absolute inset-0 w-full h-full object-cover hidden">
                                    <div id="photoPlaceholder" class="flex flex-col items-center gap-2 text-p-pink">
                                        <i data-lucide="camera" class="w-8 h-8"></i>
                                        <span class="text-xs font-bold">写真をえらぶ</span>
                                    </div>
                                    <button id="removePhotoBtn" class="absolute top-2 right-2 p-2 bg-rose-400 text-white rounded-full hidden hover:scale-110 transition shadow-lg">
                                        <i data-lucide="x" class="w-4 h-4"></i>
                                    </button>
                                    <input type="file" id="diaryPhoto" class="absolute inset-0 opacity-0 cursor-pointer" accept="image/*">
                                </div>
                            </div>

                            <!-- Stamp Selector -->
                            <div>
                                <label class="block text-sm font-bold text-p-pink mb-3">とくべつなスタンプ</label>
                                <div class="grid grid-cols-4 gap-2" id="stampSelector">
                                    <button data-stamp="birthday" class="stamp-btn p-2 rounded-xl border-2 border-p-pink-light hover:border-p-pink transition text-2xl" title="たんじょうび">🎂</button>
                                    <button data-stamp="travel" class="stamp-btn p-2 rounded-xl border-2 border-p-pink-light hover:border-p-pink transition text-2xl" title="りょこう">✈️</button>
                                    <button data-stamp="eat" class="stamp-btn p-2 rounded-xl border-2 border-p-pink-light hover:border-p-pink transition text-2xl" title="おいしいもの">🍱</button>
                                    <button data-stamp="shop" class="stamp-btn p-2 rounded-xl border-2 border-p-pink-light hover:border-p-pink transition text-2xl" title="おかいもの">🛍️</button>
                                    <button data-stamp="work" class="stamp-btn p-2 rounded-xl border-2 border-p-pink-light hover:border-p-pink transition text-2xl" title="おしごと">💻</button>
                                    <button data-stamp="game" class="stamp-btn p-2 rounded-xl border-2 border-p-pink-light hover:border-p-pink transition text-2xl" title="ゲーム">🎮</button>
                                    <button data-stamp="star" class="stamp-btn p-2 rounded-xl border-2 border-p-pink-light hover:border-p-pink transition text-2xl" title="きらきら">🌟</button>
                                    <button data-stamp="none" class="stamp-btn p-2 rounded-xl border-2 border-p-pink-light hover:border-p-pink transition text-sm font-bold text-p-pink" title="なし">なし</button>
                                </div>
                            </div>
                        </div>

                        <!-- Title Input -->
                        <div>
                            <label for="diaryTitle" class="block text-sm font-bold text-p-pink mb-3">タイトル</label>
                            <input type="text" id="diaryTitle" placeholder="どんな一日だった？" class="w-full px-6 py-4 bg-p-pink-light/10 border-2 border-p-pink-light rounded-[20px] focus:outline-none focus:border-p-pink font-bold text-p-text">
                        </div>

                        <!-- Content Input -->
                        <div class="flex-1 flex flex-col">
                            <label for="diaryContent" class="block text-sm font-bold text-p-pink mb-3">ないよう</label>
                            <textarea id="diaryContent" placeholder="ここにたくさん書いてね..." class="w-full flex-1 p-6 bg-p-pink-light/10 border-2 border-p-pink-light rounded-[25px] focus:outline-none focus:border-p-pink resize-none leading-relaxed text-p-text font-medium min-h-[250px] diary-paper"></textarea>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        
        <!-- Footer -->
        <footer class="mt-16 pt-8 border-t-2 border-p-pink-light text-center">
            <p class="text-p-pink font-bold">ぷりぷり日記帳 © 2026. Made with ✨</p>
        </footer>
    </div>

    <!-- Notification system -->
    <div id="toast" class="fixed bottom-10 right-10 bg-p-pink text-white px-8 py-4 rounded-[30px] shadow-lg flex items-center gap-3 transform translate-y-32 opacity-0 transition-all duration-500 pointer-events-none z-50 font-bold border-4 border-white">
        <i data-lucide="check-circle-2" class="w-6 h-6"></i>
        <span id="toastMessage">ほぞんしました！</span>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
